version: "3.9"

services:
  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - OPEN_AI_KEY=${OPEN_AI_KEY}
    env_file:
      - .env

  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app  # ✅ fix typo
    depends_on:
      - backend
    env_file:
      - .env
